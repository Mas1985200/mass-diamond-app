name: Live router evaluation

# Manual only: press "Run workflow". It calls the real Groq service with the
# repository secret GROQ_API_KEY, so it is never run by a push or a pull request
# and it never blocks a deploy. The result is written to the run summary.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Measure the router
        run: node tests/eval/live-router.eval.ts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

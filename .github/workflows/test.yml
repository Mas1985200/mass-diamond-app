name: Tests

on:
  push:
    branches: [dev]
    paths:
      - "tests/**"
      - "src/**"
      - "supabase/functions/**"
      - "package.json"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "tests/**"
      - "src/**"
      - "supabase/functions/**"
      - "package.json"
      - ".github/workflows/test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Show Node version
        run: node --version

      - name: Run tests
        run: node --test "tests/**/*.test.ts"
